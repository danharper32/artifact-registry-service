version: "3.9"

services:
  registry:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      STORAGE_DIR: /data/artifacts
      DATABASE_PATH: /data/registry.db
      BASE_URL: http://localhost:8080
      MAX_UPLOAD_MB: 500
    volumes:
      - registry_data:/data

volumes:
  registry_data:
